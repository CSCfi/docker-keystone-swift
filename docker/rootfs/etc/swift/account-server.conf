# Reference sample config (pinned to the swift version in requirements.txt):
# https://github.com/openstack/swift/blob/2.38.1/etc/account-server.conf-sample
# Deployment guide: https://docs.openstack.org/swift/latest/deployment_guide.html

[DEFAULT]
devices = /srv/node/
bind_port = 6202
workers = 0
mount_check = false
log_level = ERROR
recon_cache_path = /var/cache/swift
eventlet_debug = false
disable_fallocate = true

[pipeline:main]
pipeline = healthcheck recon account-server

[app:account-server]
use = egg:swift#account

[filter:recon]
use = egg:swift#recon

[filter:healthcheck]
use = egg:swift#healthcheck

[account-replicator]

[account-auditor]

[account-reaper]
