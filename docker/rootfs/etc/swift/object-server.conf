# Reference sample config:
# https://github.com/openstack/swift/blob/2.38.1/etc/object-server.conf-sample
# Deployment guide: https://docs.openstack.org/swift/latest/deployment_guide.html

[DEFAULT]
devices = /srv/node/
bind_port = 6200
workers = 0
mount_check = false
disable_fallocate = true
# log_facility = LOG_LOCAL3
log_level = ERROR
eventlet_debug = false

[pipeline:main]
pipeline = healthcheck recon object-server

[app:object-server]
use = egg:swift#object

[filter:recon]
use = egg:swift#recon

[filter:healthcheck]
use = egg:swift#healthcheck


[object-replicator]

[object-updater]

[object-auditor]

[object-reconstructor]

[object-relinker]

[object-expirer]
